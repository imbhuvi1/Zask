<div class="quick-edit-container flex items-start gap-4 p-4 fixed" 
     [style.top.px]="data.position.top" 
     [style.left.px]="data.position.left">
  <!-- Left Side: Card Preview & Title Edit -->
  <div class="flex-grow" [style.width.px]="data.position.width">
    <div class="bg-white rounded-xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <div *ngIf="data.card.coverColor" class="h-8 w-full" [style.background]="data.card.coverColor"></div>
      <div class="p-3">
        <textarea [(ngModel)]="cardTitle" 
                  class="w-full min-h-[100px] text-sm font-medium text-slate-800 bg-transparent border-0 outline-none resize-none focus:ring-0"
                  autofocus></textarea>
      </div>
    </div>
    <button (click)="save()" 
            class="mt-3 px-6 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/20 hover:bg-indigo-700 transition-all">
      Save
    </button>
  </div>

  <!-- Right Side: Action Buttons -->
  <div class="flex flex-col gap-2 animate-in slide-in-from-left-4 fade-in duration-300 delay-75">
    <button class="quick-action-btn" [matMenuTriggerFor]="labelsMenu">
      <mat-icon>label_outline</mat-icon>
      <span>Edit labels</span>
    </button>

    <button class="quick-action-btn" [matMenuTriggerFor]="membersMenu">
      <mat-icon>person_outline</mat-icon>
      <span>Change members</span>
    </button>

    <button class="quick-action-btn" [matMenuTriggerFor]="coverMenu">
      <mat-icon>palette</mat-icon>
      <span>Change cover</span>
    </button>

    <button class="quick-action-btn" [matMenuTriggerFor]="moveMenu">
      <mat-icon>input</mat-icon>
      <span>Move card</span>
    </button>

    <button class="quick-action-btn text-rose-600 hover:bg-rose-50" (click)="archive()">
      <mat-icon>archive</mat-icon>
      <span>Archive card</span>
    </button>
  </div>
</div>

<!-- Menus -->
<mat-menu #labelsMenu="matMenu" class="!rounded-2xl !p-3 shadow-xl border border-slate-100 !min-w-[240px]">
  <div class="px-2 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Labels</div>
  <div class="flex flex-col gap-1 max-h-60 overflow-y-auto custom-scrollbar">
    @for (label of boardLabels(); track label.labelId) {
      <button class="flex items-center justify-between h-8 px-3 rounded-lg text-white text-[11px] font-bold transition-all hover:brightness-95"
              [style.background]="label.color"
              (click)="toggleLabel(label); $event.stopPropagation()">
        <span>{{ label.name }}</span>
        <mat-icon *ngIf="hasLabel(label.labelId)" class="!text-sm">check</mat-icon>
      </button>
    }
  </div>
</mat-menu>

<mat-menu #membersMenu="matMenu" class="!rounded-2xl !p-3 shadow-xl border border-slate-100 !min-w-[240px]">
  <div class="px-2 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Members</div>
  <div class="flex flex-col gap-1">
    @for (m of boardMembers(); track m.userId) {
      <button class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 transition-all text-left"
              (click)="toggleMember(m.userId); $event.stopPropagation()">
        <div class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0 shadow-sm">
          {{ m.fullName?.charAt(0) || 'U' }}
        </div>
        <span class="text-xs font-semibold text-slate-700 flex-grow truncate">{{ m.fullName }}</span>
        <mat-icon *ngIf="isMemberAssigned(m.userId)" class="!text-indigo-600 !text-lg">check_circle</mat-icon>
      </button>
    }
  </div>
</mat-menu>

<mat-menu #coverMenu="matMenu" class="!rounded-2xl !p-0 shadow-2xl border border-slate-100 !min-w-[280px]">
  <div class="p-4" (click)="$event.stopPropagation()">
    <!-- Size Section -->
    <div class="mb-4">
      <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Size</h4>
      <div class="grid grid-cols-2 gap-2">
        <button class="flex flex-col border-2 rounded-lg overflow-hidden transition-all text-left"
                [class.border-indigo-600]="data.card.coverSize === 'TOP' || (!data.card.coverSize && data.card.coverColor)"
                [class.border-slate-100]="data.card.coverSize !== 'TOP' && (data.card.coverSize || !data.card.coverColor)"
                (click)="updateCoverField('coverSize', 'TOP')">
          <div class="h-6 w-full" [style.background]="data.card.coverColor || '#f1f5f9'"></div>
          <div class="p-1.5 bg-white flex-grow">
            <div class="h-1 w-full bg-slate-100 rounded-full mb-1"></div>
            <div class="h-1 w-2/3 bg-slate-100 rounded-full"></div>
          </div>
        </button>

        <button class="flex flex-col border-2 rounded-lg overflow-hidden transition-all text-left"
                [class.border-indigo-600]="data.card.coverSize === 'FULL'"
                [class.border-slate-100]="data.card.coverSize !== 'FULL'"
                (click)="updateCoverField('coverSize', 'FULL')">
          <div class="flex-grow w-full p-1.5 flex flex-col justify-end gap-1" [style.background]="data.card.coverColor || '#f1f5f9'">
            <div class="h-1 w-full bg-black/10 rounded-full"></div>
            <div class="h-1 w-2/3 bg-black/10 rounded-full"></div>
          </div>
        </button>
      </div>
    </div>

    <!-- Colors Section -->
    <div>
      <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Colors</h4>
      <div class="grid grid-cols-4 gap-2">
        @for (lc of labelColors; track lc.color) {
          <button class="aspect-square rounded shadow-sm hover:scale-110 transition-all flex items-center justify-center"
                  [style.backgroundColor]="lc.color"
                  (click)="updateCoverColor(lc.color)">
            <mat-icon *ngIf="data.card.coverColor === lc.color" class="!text-white !text-[12px] !w-3 !h-3">check</mat-icon>
          </button>
        }
        <button class="aspect-square rounded border-2 border-dashed border-slate-200 flex items-center justify-center text-slate-400"
                (click)="removeCover()">
          <mat-icon class="!text-sm">block</mat-icon>
        </button>
      </div>
    </div>
  </div>
</mat-menu>

<mat-menu #moveMenu="matMenu" class="!rounded-2xl !p-4 shadow-xl border border-slate-100 !min-w-[280px]">
  <div class="px-1 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Move Card</div>
  
  <div class="flex flex-col gap-4" (click)="$event.stopPropagation()">
    <div class="flex flex-col gap-1.5">
      <label class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Workspace</label>
      <select class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-indigo-500"
              [ngModel]="selectedWorkspaceId()" (ngModelChange)="onWorkspaceSelect($event)">
        <option [value]="null" disabled>Select Workspace</option>
        @for (ws of workspaces(); track ws.workspaceId) {
          <option [value]="ws.workspaceId">{{ ws.name }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1.5" *ngIf="selectedWorkspaceId()">
      <label class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Board</label>
      <select class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-indigo-500"
              [ngModel]="selectedBoardId()" (ngModelChange)="onBoardSelect($event)">
        <option [value]="null" disabled>Select Board</option>
        @for (b of workspaceBoards(); track b.boardId) {
          <option [value]="b.boardId">{{ b.name }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1.5" *ngIf="selectedBoardId()">
      <label class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">List</label>
      <select class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-indigo-500"
              [ngModel]="selectedListId()" (ngModelChange)="selectedListId.set($event)">
        <option [value]="null" disabled>Select List</option>
        @for (l of boardLists(); track l.listId) {
          <option [value]="l.listId">{{ l.name }}</option>
        }
      </select>
    </div>

    <button class="w-full py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/20 disabled:opacity-50"
            [disabled]="!selectedListId()"
            (click)="moveCard()">
      Move Card
    </button>
  </div>
</mat-menu>
